<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mochi's Little World 🍡</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Quicksand:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --pink: #ffd6e3;
            --cream: #fff8f0;
            --lav: #e4d9ff;
            --red: #e8546e;
            --navy: #141a3a;
            --ink: #3a2f45;
            --glass: rgba(255, 255, 255, .55);
            --sh: 0 10px 30px rgba(120, 80, 130, .18);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 70px
        }

        body {
            font-family: Quicksand, system-ui, -apple-system, sans-serif;
            background: var(--cream);
            color: var(--ink);
            line-height: 1.6;
            overflow-x: hidden
        }

        h1,
        h2 {
            font-weight: 700
        }

        .hand {
            font-family: Caveat, cursive, "Segoe Script";
            font-weight: 600
        }

        section {
            position: relative;
            padding: 90px 20px;
            overflow: hidden
        }

        .wrap {
            max-width: 980px;
            margin: auto;
            position: relative;
            z-index: 2
        }

        h2 {
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            text-align: center
        }

        .sub {
            text-align: center;
            opacity: .75;
            margin: 8px 0 34px
        }

        .bg-pink {
            background: linear-gradient(160deg, #fff0f5, var(--pink))
        }

        .bg-lav {
            background: linear-gradient(160deg, #f3eeff, var(--lav))
        }

        .bg-cream {
            background: linear-gradient(160deg, var(--cream), #ffeef3)
        }

        .dark {
            background: linear-gradient(180deg, #1b2150, var(--navy));
            color: #fff
        }

        button {
            font: inherit;
            cursor: pointer;
            border: 0;
            color: inherit;
            background: none
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid var(--red);
            outline-offset: 3px
        }

        /* loader */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: var(--cream);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: opacity .6s, visibility .6s
        }

        #loader.gone {
            opacity: 0;
            visibility: hidden
        }

        /* mochi */
        .mochi {
            width: 64px;
            height: 52px;
            background: #fff;
            border-radius: 50% 50% 45% 45%;
            position: relative;
            box-shadow: inset 0 -6px 0 #ffe3ec, var(--sh);
            animation: bounce 1.1s ease-in-out infinite
        }

        .mochi:before,
        .mochi:after {
            content: "";
            position: absolute;
            top: 22px;
            width: 6px;
            height: 8px;
            background: #3a2f45;
            border-radius: 50%
        }

        .mochi:before {
            left: 18px
        }

        .mochi:after {
            right: 18px
        }

        .mochi i {
            position: absolute;
            top: 32px;
            width: 10px;
            height: 6px;
            background: #ffb3c6;
            border-radius: 50%;
            opacity: .8
        }

        .mochi i:first-child {
            left: 8px
        }

        .mochi i:last-child {
            right: 8px
        }

        .mochi.wave b {
            position: absolute;
            right: -12px;
            top: 14px;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            transform-origin: left bottom;
            animation: wave .8s ease-in-out infinite alternate
        }

        @keyframes bounce {
            50% {
                transform: translateY(-14px) scaleY(1.06)
            }
        }

        @keyframes wave {
            to {
                transform: rotate(-35deg)
            }
        }

        /* nav */
        nav {
            position: fixed;
            top: calc(10px + env(safe-area-inset-top, 0px));
            left: 50%;
            transform: translate(-50%, -150%);
            z-index: 50;
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, .7);
            border-radius: 30px;
            padding: 6px 10px;
            box-shadow: var(--sh);
            transition: transform .5s;
            max-width: calc(100% - 20px)
        }

        body.entered nav {
            transform: translate(-50%, 0)
        }

        nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 2px
        }

        nav a {
            display: block;
            padding: 8px 12px;
            border-radius: 20px;
            text-decoration: none;
            color: var(--ink);
            font-size: .88rem;
            font-weight: 600;
            transition: background .2s
        }

        nav a:hover,
        nav a.on {
            background: var(--pink)
        }

        #burger {
            display: none;
            width: 44px;
            height: 44px;
            font-size: 1.4rem
        }

        @media(max-width:820px) {
            nav {
                left: auto;
                right: 10px;
                transform: translateY(-150%);
                border-radius: 24px
            }

            body.entered nav {
                transform: none
            }

            #burger {
                display: block
            }

            nav ul {
                display: none;
                flex-direction: column;
                padding: 4px 0 8px
            }

            nav.open ul {
                display: flex
            }

            nav a {
                padding: 12px 16px
            }
        }

        /* hero */
        #home {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at 30% 20%, #ffe3ee, transparent 55%), radial-gradient(circle at 80% 80%, #e4d9ff, transparent 55%), var(--cream)
        }

        #home h1 {
            font-size: clamp(2.6rem, 9vw, 5.2rem);
            font-family: Caveat, cursive
        }

        #home p {
            font-size: clamp(1.05rem, 3vw, 1.4rem);
            margin: 10px 0 32px;
            opacity: .85
        }

        .cta {
            background: linear-gradient(135deg, #ff8fab, var(--red));
            color: #fff;
            padding: 16px 34px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.05rem;
            box-shadow: 0 8px 28px rgba(232, 84, 110, .4);
            transition: transform .25s, box-shadow .25s;
            animation: glow 2.6s ease-in-out infinite
        }

        .cta:hover {
            transform: translateY(-3px) scale(1.04)
        }

        .cta:active {
            transform: scale(.94)
        }

        @keyframes glow {
            50% {
                box-shadow: 0 8px 40px rgba(232, 84, 110, .7)
            }
        }

        .scroll {
            position: absolute;
            bottom: 20px;
            font-size: .8rem;
            letter-spacing: .2em;
            opacity: .6;
            animation: bounce 2s infinite;
            background: none
        }

        #home .mochi {
            position: absolute;
            bottom: 56px;
            left: 50%;
            margin-left: -32px;
            transform-origin: bottom
        }

        main {
            display: none
        }

        body.entered main {
            display: block
        }

        /* cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px
        }

        .flip {
            perspective: 900px;
            height: 190px
        }

        .flip>div {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform .7s;
            transform-style: preserve-3d
        }

        .flip.on>div {
            transform: rotateY(180deg)
        }

        .face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 22px;
            padding: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid #fff;
            box-shadow: var(--sh)
        }

        .face.back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #fff, #ffe3ec);
            font-size: .98rem
        }

        .flip button {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 22px;
            transition: transform .25s
        }

        .flip:hover button {
            transform: translateY(-5px)
        }

        .face b {
            font-size: 1.15rem
        }

        .ico {
            display: block;
            font-size: 1.6rem;
            margin-bottom: 6px
        }

        .lit {
            background: var(--glass);
            border: 1px solid #fff;
            border-radius: 22px;
            box-shadow: var(--sh);
            text-align: left;
            padding: 18px 20px;
            width: 100%;
            transition: transform .25s
        }

        .lit:hover {
            transform: translateY(-5px) rotate(-.6deg)
        }

        .lit b {
            display: block;
            font-size: 1.05rem
        }

        .lit .ans {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height .5s, opacity .5s, margin .4s;
            white-space: pre-line
        }

        .lit.open .ans {
            max-height: 260px;
            opacity: 1;
            margin-top: 10px
        }

        /* reveal */
        .rv {
            opacity: 0;
            transform: translateY(26px);
            transition: opacity 1s, transform 1s
        }

        .rv.in {
            opacity: 1;
            transform: none
        }

        .now p {
            font-size: clamp(1.3rem, 4vw, 2rem);
            text-align: center;
            margin: 0 auto;
            max-width: 640px;
            white-space: pre-line
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: tw 3s ease-in-out infinite;
            opacity: .8
        }

        .bg-pink .star,
        .bg-lav .star,
        .now .star {
            background: #f3a6bf
        }

        @keyframes tw {
            50% {
                opacity: .15;
                transform: scale(1.8)
            }
        }

        .sep {
            text-align: center;
            color: #e8a3b8;
            letter-spacing: 1em;
            margin: 26px 0;
            font-size: 1rem;
            animation: tw 3s infinite
        }

        /* envelopes */
        .env {
            width: 100%;
            height: 210px;
            position: relative;
            perspective: 800px;
            border-radius: 12px
        }

        .env .paper {
            position: absolute;
            left: 8%;
            right: 8%;
            bottom: 8px;
            top: 30px;
            background: #fff;
            border-radius: 8px;
            padding: 14px;
            font-size: .88rem;
            overflow: auto;
            transition: transform .8s .25s;
            z-index: 1;
            box-shadow: 0 2px 8px #0002
        }

        .env .body {
            position: absolute;
            inset: 50px 0 0;
            background: linear-gradient(135deg, #ffc2d4, #ffa9c3);
            border-radius: 0 0 14px 14px;
            z-index: 2;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 14px;
            font-weight: 700;
            text-align: center;
            box-shadow: var(--sh);
            transition: opacity .5s .3s
        }

        .env .flap {
            position: absolute;
            left: 0;
            right: 0;
            top: 50px;
            height: 80px;
            background: #ff93b1;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top;
            transition: transform .6s;
            z-index: 3;
            backface-visibility: visible
        }

        .env.on .flap {
            transform: rotateX(180deg);
            z-index: 0
        }

        .env.on .paper {
            transform: translateY(-34px);
            z-index: 4
        }

        .env.on .body {
            opacity: .55
        }

        .env.on {
            height: 260px
        }

        .env {
            transition: height .6s
        }

        .envbtn {
            position: absolute;
            inset: 0;
            z-index: 5;
            width: 100%
        }

        .env.on .envbtn {
            pointer-events: none
        }

        .env .x {
            position: absolute;
            right: 6px;
            top: 2px;
            z-index: 6;
            display: none;
            font-size: 1.2rem;
            width: 40px;
            height: 40px
        }

        .env.on .x {
            display: block
        }

        /* someday */
        .float {
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .3);
            backdrop-filter: blur(8px);
            color: #fff;
            border-radius: 20px;
            padding: 20px;
            text-align: left;
            width: 100%;
            box-shadow: 0 0 24px rgba(160, 140, 255, .25);
            transition: transform .3s;
            animation: fl 6s ease-in-out infinite
        }

        .float:hover {
            transform: translateY(-6px)
        }

        .float em {
            display: block;
            font-style: normal;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: .5s;
            color: #ffd6e3
        }

        .float.open em {
            max-height: 160px;
            opacity: 1;
            margin-top: 10px
        }

        .grid>*:nth-child(2n) .float {
            animation-delay: -2s
        }

        .grid>*:nth-child(3n) .float {
            animation-delay: -4s
        }

        @keyframes fl {
            50% {
                translate: 0 -7px
            }
        }

        .map {
            width: min(100%, 520px);
            display: block;
            margin: 0 auto 30px;
            filter: drop-shadow(0 0 14px #9b8cff)
        }

        /* quiz */
        .q {
            max-width: 560px;
            margin: auto;
            background: var(--glass);
            border: 1px solid #fff;
            border-radius: 24px;
            padding: 26px;
            box-shadow: var(--sh)
        }

        .q h3 {
            margin-bottom: 14px
        }

        .opt {
            display: block;
            width: 100%;
            text-align: left;
            padding: 13px 16px;
            margin: 8px 0;
            border-radius: 14px;
            background: #fff;
            border: 2px solid transparent;
            transition: .2s;
            font-weight: 600
        }

        .opt:hover:not(:disabled) {
            border-color: var(--pink);
            transform: translateX(4px)
        }

        .opt.right {
            background: #d8f5df;
            border-color: #58b873
        }

        .opt.wrong {
            background: #ffdfe4;
            border-color: var(--red)
        }

        .fb {
            min-height: 28px;
            margin: 10px 0;
            font-weight: 700
        }

        .meta {
            display: flex;
            justify-content: space-between;
            font-size: .85rem;
            opacity: .7;
            margin-bottom: 10px
        }

        .sm {
            background: var(--red);
            color: #fff;
            padding: 11px 24px;
            border-radius: 30px;
            font-weight: 700
        }

        /* surprise */
        #surprise {
            text-align: center;
            transition: background 1.5s
        }

        #surprise.lit-up {
            background: linear-gradient(160deg, #ffe3ee, #e4d9ff, #ffe9c9)
        }

        .box {
            width: 130px;
            height: 110px;
            margin: 30px auto 0;
            position: relative
        }

        .box .b {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 78px;
            background: linear-gradient(#ff8fab, #e8546e);
            border-radius: 6px 6px 12px 12px
        }

        .box .b:after {
            content: "";
            position: absolute;
            left: 50%;
            margin-left: -9px;
            top: 0;
            bottom: 0;
            width: 18px;
            background: #fff3
        }

        .box .l {
            position: absolute;
            top: 8px;
            left: -8px;
            right: -8px;
            height: 32px;
            background: #ff6f91;
            border-radius: 8px;
            transition: transform .8s;
            transform-origin: left bottom;
            animation: wob 2s infinite
        }

        .box.on .l {
            transform: translate(30px, -60px) rotate(28deg);
            animation: none
        }

        @keyframes wob {
            50% {
                transform: rotate(-2deg)
            }
        }

        .msg {
            opacity: 0;
            transition: opacity 1.2s;
            min-height: 150px;
            margin-top: 20px
        }

        .msg.in {
            opacity: 1
        }

        .msg h3 {
            font-size: clamp(1.4rem, 4vw, 2rem)
        }

        .sp {
            position: absolute;
            font-size: 1.1rem;
            pointer-events: none;
            animation: spk 1.4s ease-out forwards
        }

        @keyframes spk {
            from {
                opacity: 1;
                transform: translate(0, 0)
            }

            to {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(.4)
            }
        }

        /* final */
        #final {
            min-height: 100vh;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 140px
        }

        .moon {
            position: absolute;
            top: 50px;
            right: 12%;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #fff6d6;
            box-shadow: 0 0 40px 12px rgba(255, 240, 180, .4), inset -12px -4px 0 #f3e3a8
        }

        #final p {
            font-size: clamp(1.15rem, 3.6vw, 1.7rem);
            margin: 26px 0
        }

        #final h3 {
            font-size: clamp(2rem, 7vw, 3.4rem);
            margin-top: 20px
        }

        #final .mochi {
            position: absolute;
            bottom: 34px;
            left: 50%;
            margin-left: -32px;
            animation-duration: 2s
        }

        .ms {
            position: fixed;
            right: 14px;
            bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            z-index: 60;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--glass);
            backdrop-filter: blur(10px);
            box-shadow: var(--sh);
            font-size: 1.3rem;
            display: none
        }

        body.entered .ms {
            display: block
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 80px;
            transform: translateX(-50%);
            background: var(--ink);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: .85rem;
            opacity: 0;
            transition: .4s;
            z-index: 70;
            pointer-events: none
        }

        #toast.on {
            opacity: 1
        }

        .still *,
        .still *:before,
        .still *:after {
            animation: none !important;
            transition-duration: .01ms !important
        }

        .still html {
            scroll-behavior: auto
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *:before,
            *:after {
                animation: none !important;
                transition-duration: .01ms !important
            }

            html {
                scroll-behavior: auto
            }

            .star {
                display: none
            }

            .rv {
                opacity: 1;
                transform: none
            }
        }
    </style>
</head>

<body>

                    ["Maybe someday all of this will just be a funny story about two people who met online.", "Whatever it becomes, I'm glad it started."]]
            },
            quiz: {
                title: "How well do you know Het? 🎮", sub: "Five little questions. No pressure. (Okay, a little pressure.)",
                // answer = index of the correct option. EDIT these to the real answers!
                qs: [
                    {q: "What would Het probably choose?", o: ["A night in with snacks", "A big party", "A long hike at dawn"], a: 0, r: ["Correct. Cozy wins. 😌", "Not quite… he's more of a blanket person."]},
                    {q: "Het's most likely reaction to a surprise gift?", o: ["Pretend it's nothing", "Smile way too much", "Immediately make a joke"], a: 1, r: ["Yep, caught. 😭", "Close, but the smiling is the giveaway."]},
                    {q: "Best way to describe Het's humor?", o: ["Dry and serious", "Teasing and playful", "Only dad jokes"], a: 1, r: ["Dangerously accurate. 😂", "Hmm, think about who gets teased the most…"]},
                    {q: "What does Het do when he's supposed to be productive?", o: ["Builds websites instead", "Cleans everything", "Takes a perfect nap"], a: 0, r: ["Guilty. This very site proves it. 😂", "Nope, the evidence is literally on your screen."]},
                    {q: "What's Het's favourite person to talk to?", o: ["A mystery", "You, probably", "His phone's weather app"], a: 1, r: ["Okay, okay, you got me. ❤️", "Wrong! Look closer. 👀"]}],
                res: [[2, "Hmmmm… we need to talk more. 😂"], [4, "Okayyy, you actually know me pretty well 👀"], [5, "EXCUSE ME?! How do you know me this well? 😭❤️"]]
            },
            surprise: {pre: "There's one more thing…", btn: "Open it", msg: "You're genuinely special to me, Mochi. 🍡❤️", msg2: "And yes… I spent way too much time making this website for you. 😂", keep: "Keep going →"},
            final: {lines: ["I don't know where this feeling will take us.", "I don't want to rush it or force anything.", "I just know that you're someone very special to me, Mochi.", "And I'm really glad I met you. ❤️"], sign: "Made with care, just for Mochi 🍡"}
        };
    </script>
    <div id="loader">

    <script>
        const $ = s => document.querySelector(s), C = CONFIG;
        const mk = (t, c, h) => {const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e};
        const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
        function toast(t) {const e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 2200)}
        function go(id) {const e = document.querySelector(id); if (!e) return; if (id === '#final') e.style.display = 'flex'; e.scrollIntoView({behavior: reduce ? 'auto' : 'smooth'})}
        /* static text */
        $('#ltxt').textContent = C.loading; $('#h1').textContent = C.hero.title; $('#hp').textContent = C.hero.sub; $('#enter').textContent = C.hero.btn;
        $('#t1').textContent = C.special.title; $('#s1').textContent = C.special.sub;
        $('#t5').textContent = C.little.title; $('#s5').textContent = C.little.sub; $('#t2').textContent = C.now.title;
        $('#t3').textContent = C.open.title; $('#s3').textContent = C.open.sub; $('#t4').textContent = C.someday.title; $('#s4').textContent = C.someday.sub;
        $('#t6').textContent = C.quiz.title; $('#s6').textContent = C.quiz.sub; $('#t7').textContent = C.surprise.pre; $('#open1').textContent = C.surprise.btn;
        $('#m1').textContent = C.surprise.msg; $('#m2').textContent = C.surprise.msg2; $('#keep').textContent = C.surprise.keep;
        /* nav */
        C.nav.forEach(([n, h]) => {const li = mk('li'), a = mk('a', '', n); a.href = h; a.onclick = e => {e.preventDefault(); $('#nav').classList.remove('open'); $('#burger').setAttribute('aria-expanded', 'false'); if (h === '#home') scrollTo({top: 0, behavior: reduce ? 'auto' : 'smooth'}); else go(h)}; li.append(a); $('#links').append(li)});
        $('#burger').onclick = () => {const o = $('#nav').classList.toggle('open'); $('#burger').setAttribute('aria-expanded', o)};
        /* flip cards */
        C.special.cards.forEach(([i, t, m]) => {const f = mk('div', 'flip rv'); f.innerHTML = `<button aria-pressed="false"><div><span class="face"><span><span class="ico">${i}</span><b>${t}</b></span></span><span class="face back">${m}</span></div></button>`; const b = f.firstChild; b.onclick = () => {b.setAttribute('aria-pressed', f.classList.toggle('on'))}; $('#g1').append(f)});
        /* little */
        C.little.cards.forEach(([i, t, a]) => {const b = mk('button', 'lit rv', `<span class="ico">${i}</span><b>${t}</b><div class="ans"></div>`); b.querySelector('.ans').textContent = a; b.setAttribute('aria-expanded', 'false'); b.onclick = () => b.setAttribute('aria-expanded', b.classList.toggle('open')); $('#g5').append(b)});
        /* now */
        C.now.lines.forEach((l, i) => {const p = mk('p', 'rv'); p.textContent = l; $('#nowtxt').append(p); if (i < 2) $('#nowtxt').append(mk('div', 'sep rv', '✦ ✦ ✦'))});
        /* envelopes */
        C.open.items.forEach(([t, m]) => {const w = mk('div', 'rv'); const e = mk('div', 'env', `<div class="paper"></div><div class="body">${t}</div><div class="flap"></div><button class="envbtn" aria-label="${t}"></button><button class="x" aria-label="Close envelope">✕</button>`); e.querySelector('.paper').textContent = m; e.querySelector('.envbtn').onclick = () => e.classList.add('on'); e.querySelector('.x').onclick = () => e.classList.remove('on'); w.append(e); $('#g3').append(w)});
        /* someday */
        C.someday.items.forEach(([t, m]) => {const w = mk('div', 'rv'), b = mk('button', 'float', `${t}<em></em>`); b.querySelector('em').textContent = m; b.onclick = () => b.classList.toggle('open'); w.append(b); $('#g4').append(w)});
        /* quiz */
        let qi = 0, sc = 0;
        function qrender() {
            const Q = C.quiz.qs, b = $('#qbox'); b.innerHTML = '';
            if (qi >= Q.length) {const r = C.quiz.res.find(x => sc <= x[0]) || C.quiz.res.at(-1); b.innerHTML = `<div class="meta"><span>Done!</span></div><h3 class="hand" style="font-size:2.2rem">${sc} / ${Q.length}</h3><p class="fb"></p><button class="sm">Play again</button>`; b.querySelector('.fb').textContent = r[1]; b.querySelector('button').onclick = () => {qi = 0; sc = 0; qrender()}; return }
            const q = Q[qi]; b.append(mk('div', 'meta', `<span>Question ${qi + 1}/${Q.length}</span><span>Score: ${sc}</span>`)); b.append(mk('h3', '', q.q));
            const fb = mk('p', 'fb'), next = mk('button', 'sm', qi == Q.length - 1 ? 'See my result' : 'Next'); next.style.display = 'none';
            q.o.forEach((o, i) => {const bt = mk('button', 'opt'); bt.textContent = o; bt.onclick = () => {b.querySelectorAll('.opt').forEach((x, j) => {x.disabled = true; if (j === q.a) x.classList.add('right')}); const ok = i === q.a; if (ok) sc++; else bt.classList.add('wrong'); fb.textContent = ok ? q.r[0] : q.r[1]; next.style.display = 'inline-block'}; b.append(bt)});
            next.onclick = () => {qi++; qrender()}; b.append(fb, next)
        }
        qrender();
        /* surprise */
        $('#open1').onclick = () => {
            $('#box').classList.add('on'); $('#surprise').classList.add('lit-up'); $('#open1').style.display = 'none'; $('#msg').classList.add('in');
            if (!reduce) {const bx = $('#box').getBoundingClientRect(), sr = $('#surprise').getBoundingClientRect(); for (let i = 0; i < 16; i++) {const s = mk('span', 'sp', ['✨', '⭐', '💫', '🌸'][i % 4]); s.style.left = bx.left - sr.left + bx.width / 2 + 'px'; s.style.top = bx.top - sr.top + 20 + 'px'; s.style.setProperty('--dx', (Math.random() * 240 - 120) + 'px'); s.style.setProperty('--dy', -(Math.random() * 160 + 30) + 'px'); $('#surprise').append(s); setTimeout(() => s.remove(), 1500)} }
        };
        $('#keep').onclick = () => go('#final');
        /* final */
        C.final.lines.forEach(l => {const p = mk('p', 'rv'); p.textContent = l; $('#fin').append(p)}); const s = mk('h3', 'hand rv'); s.textContent = C.final.sign; $('#fin').append(s);
        /* stars */
        document.querySelectorAll('.dark,#now,.bg-lav').forEach(sec => {if (reduce) return; for (let i = 0; i < 22; i++) {const st = mk('i', 'star'); st.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-delay:${Math.random() * 3}s;animation-duration:${2 + Math.random() * 3}s`; sec.append(st)} });
        /* reveal */
        const io = new IntersectionObserver(es => es.forEach(e => {if (e.isIntersecting) {e.target.classList.add('in'); io.unobserve(e.target)} }), {threshold: .15});
        function watch() {document.querySelectorAll('.rv:not(.in)').forEach(e => io.observe(e))} watch();
        /* nav highlight */
        const sects = [...document.querySelectorAll('section')];
        addEventListener('scroll', () => {let cur = '#home'; sects.forEach(s => {if (s.offsetParent && s.getBoundingClientRect().top < innerHeight / 2) cur = '#' + s.id}); document.querySelectorAll('#links a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === cur))}, {passive: true});
        /* enter */
        function enter() {document.body.classList.add('entered'); watch(); setTimeout(() => go('#about'), 60)}
        $('#enter').onclick = enter; $('#scr').onclick = enter;
        /* loader */
        addEventListener('load', () => setTimeout(() => $('#loader').classList.add('gone'), reduce ? 100 : 1100));
        setTimeout(() => $('#loader').classList.add('gone'), 2500);
        /* music */
        let playing = false, audio = null, ctx = null, timer = null;
        function chime() {if (!ctx || !playing) return; const n = [523.25, 587.33, 659.25, 783.99, 880][Math.floor(Math.random() * 5)], o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = n; g.gain.setValueAtTime(0, ctx.currentTime); g.gain.linearRampToValueAtTime(.08, ctx.currentTime + .05); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + 2.4); o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 2.5)}
        function setMusic(on) {
            playing = on; const b = $('#music'); b.textContent = on ? '⏸' : '🎵'; b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', on ? 'Pause music' : 'Play music'); try {sessionStorage.setItem('mochiMusic', on ? '1' : '0')} catch (e) { }
            if (C.musicSrc) {if (!audio) {audio = new Audio(C.musicSrc); audio.loop = true} on ? audio.play().catch(() => {toast('Could not load the music file'); playing = false; b.textContent = '🎵'}) : audio.pause()}
            else {if (on) {ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); chime(); timer = setInterval(chime, 1400)} else clearInterval(timer)}
        }
        $('#music').onclick = () => setMusic(!playing);
        try {if (sessionStorage.getItem('mochiMusic') === '1') toast('Tap 🎵 to resume the music')} catch (e) { }
    </script>
